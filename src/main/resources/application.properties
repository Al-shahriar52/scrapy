# ---- Database (default: file-based H2, no setup needed) ----
spring.datasource.url=jdbc:mysql://localhost:3306/beautyhaat_scraper?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Dhaka&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=Wrld_hell#1998
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Scraper ----
scraper.base-url=https://shop.shajgoj.com
scraper.shop-path=/shop
# Pause between page requests (be polite to the site)
scraper.delay-ms=1500
# Safety cap on how many pages one run may visit
scraper.max-pages=1000
scraper.timeout-ms=20000
scraper.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36

# ---- Gemini (free tier from https://aistudio.google.com/apikey) ----
# Put the key in the GEMINI_API_KEY environment variable (do not commit it).
gemini.api-key=${GEMINI_API_KEY:}
# "gemini-flash-latest" = Google's current Flash model. Open /api/ai/models to see every name your key can use.
gemini.model=gemini-flash-latest
# Pause between products in a batch (keeps you under ~10 requests/minute).
gemini.delay-ms=6500

# ---- Generated pictures ----
images.dir=./data/images
images.footer-text=BeautyHaat
